name: star-ping

on:
  schedule:
    - cron: "0 8 * * *" # every day at 08:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button for testing, no inputs

permissions:
  contents: write # needed so GITHUB_TOKEN can push the data.json snapshot
  issues: write # needed to open an Issue when configuration is missing

jobs:
  star-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      # Checks that all required secrets are configured. If any are
      # missing, opens (or reuses) an Issue explaining what's missing, and
      # the remaining steps are skipped — never fails silently in the logs.
      - name: Check required secrets
        id: check-secrets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GH_STARS_PAT: ${{ secrets.GH_STARS_PAT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        with:
          script: |
            const required = ["GH_STARS_PAT", "GMAIL_USER", "GMAIL_APP_PASSWORD", "NOTIFY_EMAIL"];
            const missing = required.filter((name) => !process.env[name]);
            core.setOutput("missing", JSON.stringify(missing));

            if (missing.length === 0) return;

            const title = "⚠️ star-ping: incomplete configuration";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            if (openIssues.some((issue) => issue.title === title)) return;

            const body = [
              "The **star-ping** workflow couldn't run because the following secrets are missing:",
              "",
              ...missing.map((name) => `- \`${name}\``),
              "",
              "Add them under **Settings → Secrets and variables → Actions → New repository secret** and check the [README](README.md#-quick-start) for instructions on how to get each one.",
              "",
              "This Issue closes automatically the next time the workflow runs successfully (feel free to close it yourself once everything is configured).",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      # The star-count snapshot lives on a dedicated orphan "data" branch,
      # never on main, so the automated updates below don't clutter main's
      # commit history. This step pulls last run's data.json from that
      # branch, if it already exists (first run ever: nothing to pull, and
      # the script below treats that as "no previous data").
      - name: Fetch previous data.json from the data branch
        if: steps.check-secrets.outputs.missing == '[]'
        run: |
          git fetch origin data 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git show origin/data:data.json > data.json
          fi

      - name: Fetch star counts and compute diff
        id: stars
        if: steps.check-secrets.outputs.missing == '[]'
        env:
          GH_STARS_PAT: ${{ secrets.GH_STARS_PAT }}
        run: node scripts/check-stars.js

      # Pushes the updated data.json straight onto the data branch via git
      # plumbing (hash-object/mktree/commit-tree), without ever checking
      # that branch out — main's working tree and history are untouched,
      # and the branch is created automatically on its first push.
      - name: Commit updated data.json to the data branch
        if: steps.stars.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BLOB=$(git hash-object -w data.json)
          TREE=$(printf '100644 blob %s\tdata.json\n' "$BLOB" | git mktree)
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            COMMIT=$(git commit-tree "$TREE" -p origin/data -m "chore: update star counts")
          else
            COMMIT=$(git commit-tree "$TREE" -m "chore: update star counts")
          fi
          git push origin "$COMMIT:refs/heads/data"

      # Current notification channel: email via Gmail SMTP. To add another
      # channel later (e.g. Discord), just add a step here that reads
      # steps.stars.outputs.notify / steps.stars.outputs.subject / email_body.html
      # — no need to touch the script.
      - name: Send email notification
        if: steps.stars.outputs.notify == 'true'
        uses: dawidd6/action-send-mail@47af4a10b540781705f283a2cf1a9650713ac795
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.stars.outputs.subject }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: star-ping <${{ secrets.GMAIL_USER }}>
          html_body: file://email_body.html

      - name: Close stale configuration issue
        if: steps.stars.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = "⚠️ star-ping: incomplete configuration";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            for (const issue of openIssues.filter((i) => i.title === title)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
