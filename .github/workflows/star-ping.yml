name: star-ping

on:
  schedule:
    - cron: "0 8 * * *" # every day at 08:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button for testing, no inputs

permissions:
  contents: write # needed so GITHUB_TOKEN can push the data.json snapshot
  issues: write # needed to open an Issue when configuration is missing

jobs:
  star-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      # Checks the only hard requirement (GH_STARS_PAT) and that at least
      # one notification channel is fully configured — which channel is
      # entirely up to you: email, Discord, and Telegram are all optional
      # and independent, you just need at least one. If that's not met,
      # opens (or reuses) an Issue explaining what's missing, and the
      # remaining steps are skipped — never fails silently in the logs.
      - name: Check configuration
        id: check-secrets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          GH_STARS_PAT: ${{ secrets.GH_STARS_PAT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const env = process.env;
            const patMissing = !env.GH_STARS_PAT;
            const hasEmail = !!(env.GMAIL_USER && env.GMAIL_APP_PASSWORD && env.NOTIFY_EMAIL);
            const hasDiscord = !!env.DISCORD_WEBHOOK_URL;
            const hasTelegram = !!(env.TELEGRAM_BOT_TOKEN && env.TELEGRAM_CHAT_ID);
            const noChannel = !hasEmail && !hasDiscord && !hasTelegram;
            const blocked = patMissing || noChannel;
            core.setOutput("blocked", blocked);

            if (!blocked) return;

            const title = "⚠️ star-ping: incomplete configuration";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            if (openIssues.some((issue) => issue.title === title)) return;

            const problems = [];
            if (patMissing) {
              problems.push("- `GH_STARS_PAT` is missing. This one is always required — it's how the workflow reads your repositories' star counts.");
            }
            if (noChannel) {
              problems.push([
                "- No notification channel is fully configured. You need **at least one** of these three (pick any, no need for all):",
                "  - **Email**: `GMAIL_USER` + `GMAIL_APP_PASSWORD` + `NOTIFY_EMAIL`",
                "  - **Discord**: `DISCORD_WEBHOOK_URL`",
                "  - **Telegram**: `TELEGRAM_BOT_TOKEN` + `TELEGRAM_CHAT_ID`",
              ].join("\n"));
            }

            const body = [
              "The **star-ping** workflow couldn't run because:",
              "",
              ...problems,
              "",
              "Add the missing secret(s) under **Settings → Secrets and variables → Actions → New repository secret** and check the [README](README.md#-quick-start) for instructions on how to get each one.",
              "",
              "This Issue closes automatically the next time the workflow runs successfully (feel free to close it yourself once everything is configured).",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      # The star-count snapshot lives on a dedicated orphan "data" branch,
      # never on main, so the automated updates below don't clutter main's
      # commit history. This step pulls last run's data.json from that
      # branch, if it already exists (first run ever: nothing to pull, and
      # the script below treats that as "no previous data").
      - name: Fetch previous data.json from the data branch
        if: steps.check-secrets.outputs.blocked == 'false'
        run: |
          git fetch origin data 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git show origin/data:data.json > data.json
          fi

      - name: Fetch star counts and compute diff
        id: stars
        if: steps.check-secrets.outputs.blocked == 'false'
        env:
          GH_STARS_PAT: ${{ secrets.GH_STARS_PAT }}
        run: node scripts/check-stars.js

      # Pushes the updated data.json straight onto the data branch via git
      # plumbing (hash-object/mktree/commit-tree), without ever checking
      # that branch out — main's working tree and history are untouched.
      # Always a fresh orphan commit, force-pushed: the data branch is a
      # snapshot of the latest state, not a history worth keeping, so it
      # never accumulates commits over time.
      - name: Commit updated data.json to the data branch
        if: steps.stars.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BLOB=$(git hash-object -w data.json)
          TREE=$(printf '100644 blob %s\tdata.json\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "chore: update star counts")
          git push --force origin "$COMMIT:refs/heads/data"

      # Email is one of three independent, optional channels — only runs if
      # all three email secrets are set. Reads the ready-made
      # email_body.html that the script above wrote.
      - name: Send email notification
        if: steps.stars.outputs.notify == 'true' && secrets.GMAIL_USER != '' && secrets.GMAIL_APP_PASSWORD != '' && secrets.NOTIFY_EMAIL != ''
        uses: dawidd6/action-send-mail@47af4a10b540781705f283a2cf1a9650713ac795
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.stars.outputs.subject }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: star-ping <${{ secrets.GMAIL_USER }}>
          html_body: file://email_body.html

      # Discord: only runs if DISCORD_WEBHOOK_URL is configured. Reads
      # changes.json (the generic diff the script wrote) and formats it as
      # Discord markdown with jq, which ships preinstalled on the runner,
      # so this needs no extra action to pin. Any other channel follows the
      # same pattern: read changes.json, format it however that channel
      # needs.
      - name: Send Discord notification
        if: steps.stars.outputs.notify == 'true' && secrets.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -r '.[] | "\(if .isNew then "🆕 " else "" end)**\(.repo)**: \(if .isNew then "new" else (.previous | tostring) end) → \(.current) (\(if .diff > 0 then "+" else "" end)\(.diff))"' changes.json > discord_lines.txt
          jq -Rs --arg subject "${{ steps.stars.outputs.subject }}" '{content: ("**" + $subject + "**\n" + .)}' discord_lines.txt > discord_payload.json
          curl -sf -X POST -H "Content-Type: application/json" -d @discord_payload.json "$DISCORD_WEBHOOK_URL"

      # Telegram: only runs if both TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID
      # are configured. Same pattern as Discord: reads changes.json,
      # formats with jq, posts with curl via the Telegram Bot API.
      - name: Send Telegram notification
        if: steps.stars.outputs.notify == 'true' && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          jq -r '.[] | "\(if .isNew then "🆕 " else "" end)<b>\(.repo | @html)</b>: \(if .isNew then "new" else (.previous | tostring) end) → \(.current) (\(if .diff > 0 then "+" else "" end)\(.diff))"' changes.json > telegram_lines.txt
          jq -Rs --arg subject "${{ steps.stars.outputs.subject }}" --arg chat_id "$TELEGRAM_CHAT_ID" '{chat_id: $chat_id, parse_mode: "HTML", text: ("<b>" + $subject + "</b>\n" + .)}' telegram_lines.txt > telegram_payload.json
          curl -sf -X POST -H "Content-Type: application/json" -d @telegram_payload.json "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

      - name: Close stale configuration issue
        if: steps.stars.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = "⚠️ star-ping: incomplete configuration";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            for (const issue of openIssues.filter((i) => i.title === title)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
